name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          tools: composer

      - name: Install dev dependencies
        run: composer install --no-interaction --no-progress

      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      # The tag is the source of truth for the version. A zip whose plugin
      # header disagrees with its tag is the kind of thing nobody notices until
      # a site will not update, so it fails the release instead.
      - name: Check the tag matches the plugin header
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HEADER=$(grep -m1 '^ \* Version:' bugbottle.php | awk '{print $3}')
          echo "tag=$TAG header=$HEADER"
          test "$TAG" = "$HEADER"

      # The zip has to unpack into the directory WordPress.org will install the
      # plugin as, which is the slug: `bugbottle`. Everything dev-only —
      # `vendor/`, Composer, PHPStan, the workflows, the repo docs — is left
      # out, because the Plugin Check rejects most of it and none of it is
      # useful on a live site.
      - name: Build the zip
        run: bash bin/build-zip.sh

      - name: Show what shipped
        run: unzip -l bugbottle.zip

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: bugbottle.zip
          generate_release_notes: true
